server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS（127.0.0.11）：backend 容器每次重建 IP 都会变，
    # nginx 启动时会缓存 proxy_pass 域名的解析结果，缓存到旧 IP 就会 502。
    # 用变量形式的 proxy_pass 强制按请求实时解析（valid=5s）。
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream http://backend:8000;

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 实时事件流（4.3 节）：关闭缓冲、放宽读超时，保证事件即时下发
    # （前缀匹配优先级高于 /api/，proxy_pass 不带 URI 部分以保持原始路径）
    location /api/v1/events/stream {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API 反向代理到 backend 容器
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康检查端点与 /health 直通
    location = /health {
        proxy_pass $backend_upstream/health;
    }
}
