name: agentos

services:
  postgres:
    # pgvector 官方镜像（基于 postgres:16），提供 vector 扩展供记忆模块语义检索使用
    image: pgvector/pgvector:pg16
    container_name: agentos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentos}
      POSTGRES_USER: ${POSTGRES_USER:-agentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentos-dev-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # 仅回环映射 5436，供宿主机图形工具（DBeaver/VS Code 插件等）连接；
    # 不绑 0.0.0.0（19.4 节安全要求）；宿主机 5432-5435 是系统自带 postgres，别连错
    ports:
      - "127.0.0.1:5436:5432"
    # 不发布端口：仅 Compose 内部网络可访问（宿主机 5432 已被系统 postgres 占用，且 19.4 节要求不对外开放）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agentos-redis
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - ./data/redis:/data
    # 不发布端口：仅 Compose 内部网络可访问（宿主机 6379 已被系统 redis 占用，且 19.4 节要求不对外开放）
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        # 国内网络镜像；通用环境可改为 https://pypi.org/simple
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: agentos-backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://agentos:agentos-dev-password@postgres:5432/agentos}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOG_DIR: /app/data/logs
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      AGENT_RUN_MAX_RETRIES: ${AGENT_RUN_MAX_RETRIES:-3}
      AGENT_RUN_RETRY_BASE_SECONDS: ${AGENT_RUN_RETRY_BASE_SECONDS:-30}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/data/uploads}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20971520}
      UPLOAD_ALLOWED_EXTENSIONS: ${UPLOAD_ALLOWED_EXTENSIONS:-.txt,.md,.csv,.json,.pdf,.png,.jpg,.jpeg,.zip,.docx}
      UPLOAD_ALLOWED_MIME_TYPES: ${UPLOAD_ALLOWED_MIME_TYPES:-text/plain,text/markdown,text/csv,application/json,application/pdf,image/png,image/jpeg,application/zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
    ports:
      - "8000:8000"
    volumes:
      - ./data/logs:/app/data/logs
      - ./data/uploads:/app/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: agentos-worker
    command: ["python", "-m", "app.workers.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://agentos:agentos-dev-password@postgres:5432/agentos}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOG_DIR: /app/data/logs
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      AGENT_RUN_MAX_RETRIES: ${AGENT_RUN_MAX_RETRIES:-3}
      AGENT_RUN_RETRY_BASE_SECONDS: ${AGENT_RUN_RETRY_BASE_SECONDS:-30}
    volumes:
      - ./data/logs:/app/data/logs
      - ./data/uploads:/app/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "worker"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: agentos-scheduler
    command: ["python", "-m", "app.workers.scheduler"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://agentos:agentos-dev-password@postgres:5432/agentos}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOG_DIR: /app/data/logs
      SCHEDULER_EXAMPLE_INTERVAL_SECONDS: ${SCHEDULER_EXAMPLE_INTERVAL_SECONDS:-60}
      DUE_SCAN_INTERVAL_SECONDS: ${DUE_SCAN_INTERVAL_SECONDS:-300}
      AGENT_RISK_SCAN_INTERVAL_SECONDS: ${AGENT_RISK_SCAN_INTERVAL_SECONDS:-86400}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
    volumes:
      - ./data/logs:/app/data/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "scheduler"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # 国内网络镜像；通用环境可改为 https://registry.npmjs.org
        NPM_REGISTRY: https://registry.npmmirror.com
    container_name: agentos-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
