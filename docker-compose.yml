services:
  backend:
    build: ./backend
    container_name: agentos-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: agentos-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
