[alembic]
script_location = migrations
prepend_sys_path = .
# 实际连接串由 migrations/env.py 从 app.core.config 读取，此处仅为占位
sqlalchemy.url = postgresql+asyncpg://agentos:agentos@postgres:5432/agentos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
